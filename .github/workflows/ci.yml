# .github/workflows/ci.yml
name: CI — Lint, Typecheck, Unit, RLS & Playwright E2E

on:
  push:
    branches: [main, staging, 'arena/**']
  pull_request:
    branches: [main, staging]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: supabase/setup-cli@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: 2.122.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & Lint all workspaces
        run: pnpm turbo run lint typecheck

      - name: Run Vitest unit tests
        # `turbo run test` only reaches workspaces that declare a test script, so the
        # apps/web suite (which covers the module data path and the Supabase client
        # config guards) has to be run from the repo root, where its vitest config and
        # the "@/" alias live.
        run: |
          pnpm turbo run test
          pnpm test:modules

      - name: Start local Supabase & execute pgTAP RLS isolation tests
        run: |
          run_checked() {
            local label="$1"
            shift
            echo "=== ${label} ==="
            if ! "$@" >/tmp/sb-step.log 2>&1; then
              cat /tmp/sb-step.log
              local summary
              summary=$(tr '\r\n' '  ' </tmp/sb-step.log | tail -c 900)
              echo "::error title=${label}::${summary}"
              exit 1
            fi
            cat /tmp/sb-step.log
          }

          # Boot containers first before applying 0018/0020 which depend on seed.sql (see #38).
          run_checked "supabase start" env SUPABASE_DB_MIGRATIONS_ENABLED=false SUPABASE_DB_SEED_ENABLED=false supabase start

          echo "Polling local Supabase Postgres readiness on 127.0.0.1:54322 (timeout: 30s)..."
          pg_ready=false
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 54322 -U postgres >/dev/null 2>&1; then
              pg_ready=true
              echo "Postgres accepting connections on 127.0.0.1:54322 (attempt ${attempt}/30)."
              break
            fi
            sleep 1
          done

          if [ "${pg_ready}" != "true" ]; then
            echo "::error title=pg_isready::Postgres on 127.0.0.1:54322 failed to become ready within 30 seconds after supabase start."
            supabase status || true
            exit 1
          fi

          run_checked "supabase db reset 0017" supabase db reset --local --version 0017
          run_checked "supabase migration up" supabase migration up --local
          run_checked "supabase test db" supabase test db

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @campus360/web exec playwright install --with-deps chromium

      - name: Build production web app
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm build

      - name: Run Playwright E2E suite (chromium + mobile-chrome)
        env:
          CI: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
          OTP_PEPPER_SECRET: campus360-e2e-preview-otp-pepper-secret-32b
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

